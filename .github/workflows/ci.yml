name: CI

# Typecheck, tests and the real store build on every pull request and every
# push to a working branch. Pushes to dev and main run the same three as the
# gate at the top of publish-store.yml, so they are not repeated here.
# Needs no secrets, which matters in a public repository: a pull request from a
# fork gets none.

on:
  pull_request:
  push:
    branches-ignore: [dev, main]
    paths-ignore:
      - "**/*.md"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
